<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat's Pong — The Final Serve</title><style>
:root{color-scheme:dark;--gold:#ffd36b;--ink:#0c1020;--cyan:#7ef6ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#26365b,#0c1020 65%);color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;padding:25px}.poster{max-width:920px;width:100%;border:2px solid var(--gold);padding:clamp(20px,5vw,54px);text-align:center;position:relative;box-shadow:0 0 80px #ffc65a22,inset 0 0 50px #ffd36b11;background:repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 5px)}.eyebrow{letter-spacing:.35em;color:var(--cyan);font-size:12px;font-weight:800}.title{font-size:clamp(55px,12vw,125px);font-weight:1000;line-height:1;letter-spacing:-.08em;margin:16px 0;text-shadow:6px 6px 0 #f46a64}.title span{color:var(--gold)}.tag{font-size:clamp(16px,3vw,27px);font-weight:800;letter-spacing:.12em}.court{width:min(100%,650px);height:270px;border:3px solid #f7e8c0;margin:32px auto;position:relative;overflow:hidden;background:#101c2e;box-shadow:0 0 25px #7ef6ed22}.court:before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:3px dashed #ffffff55}.paddle{position:absolute;width:12px;height:67px;background:var(--cyan);top:90px;box-shadow:0 0 20px var(--cyan)}.left{left:17px;animation:left 2.8s ease-in-out infinite alternate}.right{right:17px;background:#ff928e;box-shadow:0 0 20px #ff928e;animation:right 2.5s ease-in-out infinite alternate}.ball{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--gold);box-shadow:0 0 25px var(--gold);left:50%;top:50%;animation:ball 2.2s linear infinite alternate}.score{position:absolute;top:14px;left:0;right:0;color:#fff8;font-size:38px;font-family:monospace;letter-spacing:80px;pointer-events:none}.cta{background:var(--gold);color:#101020;border:0;padding:16px 34px;font-weight:1000;letter-spacing:.14em;cursor:pointer;box-shadow:6px 6px 0 #f46a64;font-size:15px}.cta:hover{transform:translateY(-3px)}.note{margin:18px 0;color:#c9d6e8;min-height:24px}.footer{margin-top:30px;font-size:12px;letter-spacing:.15em;color:#aab8cf}@keyframes left{to{top:160px}}@keyframes right{to{top:20px}}@keyframes ball{0%{left:8%;top:20%}25%{left:45%;top:75%}50%{left:88%;top:30%}75%{left:40%;top:10%}100%{left:8%;top:70%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="poster"><div class="eyebrow">A.C HOLDINGS PRESENTS · ARCADE SERIES 06</div><h1 class="title">CAT'S <span>PONG</span></h1><div class="tag">THE FINAL SERVE</div><p>ONE COURT. TWO RIVALS. NO REWIND BUTTON.</p><div class="court" aria-label="Animated Pong court"><div class="score">0 0</div><div class="paddle left"></div><div class="paddle right"></div><div class="ball"></div></div><button class="cta" id="start">CHALLENGE ACCEPTED</button><p class="note" id="message">A retro arcade showdown awaits.</p><div class="footer">60 FPS ARCADE SPIRIT · © AC KONDO 1999–2026 · MEOW POWERED :3</div></main><script>document.getElementById('start').addEventListener('click',()=>{document.getElementById('message').textContent='🏓 PLAYER ONE READY! OPEN CAT\'S PONG AND LET THE RALLY BEGIN!';document.querySelector('.court').style.boxShadow='0 0 45px #ffd36b88';});</script></body></html>
